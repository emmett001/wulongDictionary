<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Source Han Serif CN', 'Songti SC', serif;
    background: #E8E3DA;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    max-width: 480px; width: 100%;
    background: #FDFBF7;
    border-radius: 4px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card::before {
    content: '';
    display: block; height: 4px;
    background: linear-gradient(90deg, #5B3E96, #8B6FC0, #5B3E96);
  }
  .card-body { padding: 36px 32px 28px; text-align: center; }

  .label { font-size: 12px; color: #A8A29B; letter-spacing: 3px; margin-bottom: 16px; }
  .code-box {
    background: #F5F1E6;
    border-radius: 8px;
    padding: 20px 16px;
    margin: 20px 0;
  }
  .code-text {
    font-family: 'SF Mono', 'Menlo', 'Courier New', monospace;
    font-size: 36px; letter-spacing: 8px;
    color: #5B3E96; font-weight: 700;
  }
  .invite-no { font-size: 13px; color: #A8A29B; margin-bottom: 8px; }
  .invite-no span { color: #3A3A3A; font-weight: 600; }

  .divider {
    width: 32px; height: 2px;
    background: #5B3E96; border-radius: 1px;
    margin: 24px auto;
  }
  .tips {
    font-size: 13px; color: #3A3A3A; line-height: 2;
    text-align: left;
    background: #FDFBF7;
    border: 1px solid #E8E3DA;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .tips li { margin-left: 16px; color: #5B3E96; }
  .wish {
    font-size: 14px; color: #3A3A3A; line-height: 2;
    font-weight: 600; letter-spacing: 1px;
  }
  .card-footer {
    background: #F7F3E8; padding: 14px 32px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: #A8A29B; letter-spacing: 1px;
  }
  .seal {
    width: 44px; height: 44px;
    border: 2px solid #5B3E96;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 16px auto 0; opacity: 0.5;
  }
  .seal span { font-size: 8px; color: #5B3E96; letter-spacing: 2px; text-align: center; line-height: 1.3; }

  body { min-height: auto !important; }
</style>
</head>
<body>
<div class="card">
  <div class="card-body">
    <div class="label">激 活 码 卡</div>

    <div class="invite-no">邀请编号 <span>0036</span></div>

    <div class="code-box">
      <div class="code-text">1afe4ec2</div>
    </div>

    <div class="divider"></div>

    <div class="tips">
      <p style="margin-bottom:8px;font-weight:600;text-align:center">请妥善保管此激活码</p>
      <li>每个激活码仅限一台设备使用</li>
      <li>如更换手机，请联系管理员迁移</li>
      <li>请勿将激活码分享给他人</li>
    </div>

    <p class="wish">
      希望这份仪式感<br>能伴您学习路上一路长虹。
    </p>

    <div class="seal"><span>乌<br>龙</span></div>
  </div>
  <div class="card-footer">
    <span>《乌龙词典》APP · 激活凭证</span>
    <span>0036</span>
  </div>
</div>
</body>
</html>
